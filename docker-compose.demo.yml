# Ambiente de DEMONSTRACAO — dado ficticio, nunca paciente real.
# Ver docs/superpowers/specs/2026-08-10-ambiente-de-demonstracao-design.md
#
# Diferencas deliberadas em relacao ao docker-compose.yml de desenvolvimento:
#   - o banco NAO publica porta: so existe dentro da rede do compose;
#   - `trust` da sessao local da lugar a senha, gerada na propria instancia;
#   - api e worker sobem aqui, coisa que o compose de desenvolvimento nao faz.
name: cadencia

services:
  db:
    image: postgres:18
    container_name: cadencia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cadencia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env da instancia}
      TZ: UTC
      PGTZ: UTC
      # Identico ao compose de desenvolvimento, e nao por simetria estetica: o
      # locale do cluster so se define no initdb. Divergir aqui produziria um banco
      # que ordena texto diferente do que os testes provaram, sem aviso nenhum.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # postgres:18 declara o VOLUME em /var/lib/postgresql, nao em .../data.
      # Montar no caminho antigo deixaria o volume vazio e o banco morreria no
      # primeiro `docker compose down`.
      - cadencia-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cadencia"]
      interval: 2s
      timeout: 3s
      retries: 40

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cadencia-runtime:local
    container_name: cadencia-api
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://api@db:5432/cadencia
      DATABASE_PASSWORD: ${API_PASSWORD:?defina no .env da instancia}
      DATABASE_URL_JOBS: postgres://jobs@db:5432/cadencia
      DATABASE_JOBS_PASSWORD: ${JOBS_PASSWORD:?defina no .env da instancia}
      # `fake` continua sendo o padrao seguro. O modo `memed` so e ativado por
      # decisao explicita no .env da instancia; nunca fica gravado na imagem.
      CADENCIA_PROVIDERS: ${CADENCIA_PROVIDERS:-fake}
      CADENCIA_TOTP_KEY: ${CADENCIA_TOTP_KEY:?}
      MEMED_BASE_URL: ${MEMED_BASE_URL:-}
      MEMED_SCRIPT_URL: ${MEMED_SCRIPT_URL:-}
      MEMED_API_KEY: ${MEMED_API_KEY:-}
      MEMED_SECRET_KEY: ${MEMED_SECRET_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ICD_CLIENT_ID: ${ICD_CLIENT_ID:-}
      ICD_CLIENT_SECRET: ${ICD_CLIENT_SECRET:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:-}
      STORAGE_DIR: /var/lib/cadencia/anexos
      LOG_LEVEL: info
    ports:
      # Publica porque a funcao da Vercel precisa alcancar: e o unico servico que
      # sai da rede interna.
      - "3001:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch(process.argv[1]).then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        - http://127.0.0.1:3001/health
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    volumes:
      - cadencia-anexos:/var/lib/cadencia/anexos

  worker:
    # Mesma imagem da api — construida uma vez pelo servico acima.
    image: cadencia-runtime:local
    container_name: cadencia-worker
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://api@db:5432/cadencia
      DATABASE_PASSWORD: ${API_PASSWORD:?defina no .env da instancia}
      DATABASE_URL_JOBS: postgres://jobs@db:5432/cadencia
      DATABASE_JOBS_PASSWORD: ${JOBS_PASSWORD:?defina no .env da instancia}
      CADENCIA_PROVIDERS: ${CADENCIA_PROVIDERS:-fake}
      CADENCIA_TOTP_KEY: ${CADENCIA_TOTP_KEY:?}
      STORAGE_DIR: /var/lib/cadencia/anexos
      LOG_LEVEL: info
    volumes:
      - cadencia-anexos:/var/lib/cadencia/anexos
    command: ["pnpm", "--filter", "@cadencia/worker", "exec", "tsx", "src/worker.ts"]

  bootstrap:
    image: cadencia-runtime:local
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: cadencia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env da instancia}
      API_PASSWORD: ${API_PASSWORD:?defina no .env da instancia}
      JOBS_PASSWORD: ${JOBS_PASSWORD:?defina no .env da instancia}
    command: ["pnpm", "exec", "tsx", "scripts/bootstrap-production.ts"]

volumes:
  cadencia-pgdata:
  cadencia-anexos:
