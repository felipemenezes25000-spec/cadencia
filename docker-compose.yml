name: cadencia

services:
  db:
    # postgres:18 oficial. Traz pgcrypto, btree_gist, btree_gin, pg_trgm, unaccent,
    # citext e pg_stat_statements. NAO traz pg_partman — ver db/init/00-extensions.sql.
    image: postgres:18
    container_name: cadencia-db
    environment:
      # SOMENTE DESENVOLVIMENTO LOCAL. Em producao os papeis api/jobs/support
      # autenticam com credencial do Secrets Manager. `trust` aqui existe para que
      # o teste consiga conectar como `api` e como `jobs` sem inventar senha.
      POSTGRES_USER: postgres
      POSTGRES_DB: cadencia
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC
      PGTZ: UTC
      # C.UTF-8 e deliberado, nao esquecimento: e determinístico e imune ao
      # versionamento de collation do glibc, que corrompe indices silenciosamente
      # em upgrade de imagem ou de SO. O preco: ORDER BY direto em texto NAO ordena
      # portugues corretamente (ex.: "Alvaro" depois de "Zeca" em vez de entre "A" e
      # "B"). A busca (unaccent(lower(...)) no design) e imune a isso. Onde ordenacao
      # alfabetica importar de verdade — ex.: listagem de pacientes por nome — a
      # coluna exige COLLATE "pt-BR-x-icu" explicito (PostgreSQL 18 traz ICU
      # embutido). O locale do CLUSTER so muda com initdb, ou seja, recriando o
      # volume (`pnpm db:reset`) — nao e algo que se ajusta depois.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      # -c SOBRESCREVE a lista inteira de shared_preload_libraries, nao soma. Se
      # outra lib precisar entrar aqui no futuro, as duas vao juntas nesta mesma
      # linha, separadas por virgula (ex.: "pg_stat_statements,outra_lib").
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      # Bind explicito em loopback: o Docker publica em 0.0.0.0 por padrao, e
      # combinado com POSTGRES_HOST_AUTH_METHOD=trust isso deixaria um Postgres sem
      # senha alcancavel por qualquer maquina da rede local. 127.0.0.1 restringe
      # a conexao a propria maquina — correto para um banco de desenvolvimento.
      - "127.0.0.1:5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # postgres:18 mudou o PGDATA para /var/lib/postgresql/18/docker e declara o
      # VOLUME em /var/lib/postgresql. Montar em /var/lib/postgresql/data (caminho
      # das imagens ate a 17) deixaria o volume vazio e o banco morreria no primeiro
      # `docker compose down`.
      - cadencia-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cadencia"]
      interval: 2s
      timeout: 3s
      retries: 40

  # API da CID-11 publicada pela propria OMS, rodando localmente.
  #
  # ATRAS DE UM PROFILE de proposito: a imagem tem alguns GB e so serve para
  # CARREGAR o catalogo, algumas vezes por ano. Deixa-la no caminho de
  # `pnpm db:up` obrigaria todo mundo a baixar isso para rodar um teste.
  #
  #   pnpm icd:up        # sobe
  #   pnpm icd:down      # derruba
  #
  # NAO EXIGE OAUTH: a documentacao da OMS e explicita — "the locally deployed
  # versions do not require OAUTH-2 authentication". As credenciais de
  # `ICD_CLIENT_ID`/`ICD_CLIENT_SECRET` so valem contra id.who.int.
  #
  # POR QUE INSTANCIA PROPRIA e nao o servidor da OMS: a carga do catalogo sao
  # dezenas de milhares de requisicoes descendo a arvore da linearizacao. Fazer
  # isso contra um servico publico e abusivo, fica refem da latencia
  # transatlantica, e para se a OMS estiver fora do ar.
  icd-api:
    image: whoicd/icd-api
    container_name: cadencia-icd-api
    profiles: ["icd"]
    environment:
      # Obrigatorio. Licenca CC BY-ND 3.0 IGO: uso comercial permitido,
      # atribuicao obrigatoria, PROIBIDO publicar versao derivada.
      acceptLicense: "true"
      # A OMS coleta as buscas feitas para melhorar as ferramentas dela. Num
      # produto de prontuario o termo buscado E dado clinico: o medico digita
      # "neoplasia de mama" porque tem um paciente com isso na frente. Mandar
      # para fora seria vazamento por conveniencia.
      saveAnalytics: "false"
      # Portugues nao existe como pacote isolado; vem nesta combinacao.
      include: "2026-01_en-es-pt"
    ports:
      # Mesmo cuidado do Postgres: bind em loopback. O container nao tem
      # autenticacao nenhuma — publicar em 0.0.0.0 deixaria a API aberta na rede.
      - "127.0.0.1:8081:80"
    healthcheck:
      # Basta o app RESPONDER HTTP — inclusive 404, que ja prova que subiu e
      # esta roteando. Dois detalhes que custaram tempo:
      #   - `127.0.0.1` e nao `localhost`: dentro do container o nome resolve
      #     para ::1 e o app so escuta em IPv4, entao daria "connection refused"
      #     com o servico perfeitamente no ar;
      #   - `--spider` com grep no status, e nao o codigo de saida do wget, que
      #     e diferente de zero em qualquer 4xx.
      test: ["CMD-SHELL", "wget -S --spider -q http://127.0.0.1/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

volumes:
  cadencia-pgdata:
