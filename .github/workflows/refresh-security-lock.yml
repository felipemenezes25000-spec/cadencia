name: refresh-security-lock

on:
  push:
    branches: [chore/production-readiness]
    paths:
      - package.json
      - packages/storage/src/s3-adapter.ts
      - infra/terraform/production/**
      - .gitignore
      - .github/workflows/refresh-security-lock.yml

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/production-readiness
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: regenera lockfile com overrides corrigidos
        run: pnpm install --no-frozen-lockfile
      - name: confirma que highs conhecidos sairam da arvore de producao
        run: pnpm audit --prod --audit-level high
      - name: formata e valida Terraform
        working-directory: infra/terraform/production
        run: |
          terraform fmt
          terraform init -backend=false
          terraform validate
      - name: remove helper one-shot e publica apenas arquivos versionaveis
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-security-lock.yml
          rm -rf infra/terraform/production/.terraform
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml \
            infra/terraform/production/main.tf \
            infra/terraform/production/variables.tf \
            infra/terraform/production/versions.tf \
            infra/terraform/production/outputs.tf \
            infra/terraform/production/.terraform.lock.hcl \
            .github/workflows/refresh-security-lock.yml
          git commit -m 'chore: atualiza lockfile e formata terraform'
          HUSKY=0 git push origin HEAD:chore/production-readiness
