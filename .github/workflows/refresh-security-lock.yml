name: refresh-security-lock

on:
  push:
    branches: [chore/production-readiness]
    paths:
      - package.json
      - .github/workflows/refresh-security-lock.yml

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/production-readiness
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: regenera lockfile com overrides corrigidos
        run: pnpm install --no-frozen-lockfile
      - name: confirma que highs conhecidos sairam da arvore de producao
        run: pnpm audit --prod --audit-level high
      - name: remove helper one-shot e publica lockfile
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-security-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/refresh-security-lock.yml
          git commit -m 'chore(deps): atualiza lockfile para correcoes de seguranca'
          git push origin HEAD:chore/production-readiness
